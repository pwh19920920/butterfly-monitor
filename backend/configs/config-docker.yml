server:
  serverName: 'butterfly-monitor'
  engineMode: 'release'
  serverAddr: :8088
  methodOverride: true

db:
  dsn: 'root:root@tcp(mysql:3306)/butterfly_monitor?charset=utf8mb4&parseTime=True&loc=Local'
  maxIdleConnect: 10
  maxOpenConnect: 100
  connMaxLifeTimeSecond: 3600

# 时序存储后端：victoriaMetrics（默认）| tdEngine | promRemoteWrite
timeseries:
  backend: victoriaMetrics

# VictoriaMetrics
victoriaMetrics:
  addr: 'http://victoria-metrics:8428'
  username: ''
  password: ''
  database: 'monitor'

# Grafana
grafana:
  addr: 'http://grafana:3000'
  # 以下由 entrypoint.sh 自动填入
  # apiKey: ''
  # datasourceUid: ''

# XXL-JOB 执行器
xxl:
  serverAddr: 'http://xxl-job-admin:8080/xxl-job-admin'
  accessToken: 'default_token'


logger:
  logPath: './logs'
  closeConsoleOut: false

auth:
  # 免登录
  ignorePath:
    - GET - /api/monitor/test
    - GET - /api/monitor/homeCount
    - GET - /api/health
    - GET - /api/monitor/database/refresh
    - POST - /run
    - POST - /kill
    - POST - /log
  ignorePrefixPath:
    - GET - /api/sys/menu/refresh
    - POST - /api/monitor/task/dataPush
  # 需登录无需权限
  commonPath:
    - GET - /api/sys/menu/withOption
    - GET - /api/sys/role/all
    - GET - /api/sys/user/all
    - GET - /api/alert/channel/all
    - GET - /api/alert/group/all
    - GET - /api/monitor/dashboard/all
    - GET - /api/monitor/database/all
    - GET - /api/monitor/group/all
    - GET - /api/monitor/systemMetrics